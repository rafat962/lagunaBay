version: "3.8"

services:
    react-app:
        build:
            context: .
            dockerfile: Dockerfile
        # ❌ تمت إزالة نشر المنافذ (PORTS)
        # Nginx سيتواصل معها داخليًا على المنفذ 80
        restart: always
        volumes:
            - /app/node_modules
        networks:
            - realestatemerchants.app

    nginx:
        image: nginx:latest
        volumes:
            # 💡 ربط ملف إعداد Nginx المخصص
            - ./nginx-conf:/etc/nginx/conf.d:ro
            # ربط الـ volumes المطلوبة من Certbot
            - webroot:/var/www/html
            - certbot-etc:/etc/letsencrypt
        depends_on:
            - react-app
        networks:
            - realestatemerchants.app
        # 💡 النشر على المنفذين 80 و 443 للسماح بالوصول من الإنترنت
        ports:
            - "80:80" # HTTP (للوصول الأولي ولـ Certbot)
            - "443:443" # HTTPS (بمجرد الحصول على الشهادة)

    certbot:
        image: certbot/certbot
        container_name: certbot
        volumes:
            - certbot-etc:/etc/letsencrypt
            - certbot-var:/var/lib/letsencrypt
            - webroot:/var/www/html
        depends_on:
            - nginx
        # أمر Certbot
        command: certonly --webroot -w /var/www/html -d realestatemerchants.app --email rafatkamel96@gmail.com --agree-tos --no-eff-email --non-interactive --force-renewal

# =======================================================
# تعريف الـ VOLUMES و NETWORKS
# =======================================================
volumes:
    webroot:
    certbot-etc:
    certbot-var:

networks:
    realestatemerchants.app:
        driver: bridge
