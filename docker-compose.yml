version: "3"
services:
    nginx:
        image: nginx:alpine
        container_name: laguna-bay-nginx
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
            - /etc/letsencrypt:/etc/letsencrypt:ro
        depends_on:
            - app
        restart: always
        networks:
            - app-network

    app:
        build: .
        container_name: laguna-bay-app
        expose:
            - "3000"
        restart: always
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
