# هذا الإعداد مخصص لـ Nginx كـ Reverse Proxy لتطبيق React
# ----------------------------------------------------------------
# BLOCK 1: HTTP (Port 80) - مخصص لـ Certbot وإعادة التوجيه إلى HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name realestatemerchants.app;

    # 💡 الإصلاح الحاسم: استثناء مسار Certbot Challenge
    # إذا كان الطلب موجهاً إلى مسار التحقق، فقم بتوجيهه إلى webroot مباشرةً
    location /.well-known/acme-challenge/ {
        root /var/www/html; # يجب أن يتطابق هذا المسار مع مسار webroot في docker-compose
    }

    # توجيه الـ HTTP إلى HTTPS
    # أي طلب آخر على المنفذ 80 يتم توجيهه مباشرةً إلى HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------
# BLOCK 2: HTTPS (Port 443) - التوجيه الفعلي لتطبيق React
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name realestatemerchants.app;

    # مسارات الشهادات (سيتم إنشاؤها بواسطة Certbot)
    ssl_certificate /etc/letsencrypt/live/realestatemerchants.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realestatemerchants.app/privkey.pem;

    # إعدادات SSL أساسية
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # توجيه حركة المرور إلى حاوية تطبيق React (يستخدم اسم الخدمة في Docker Compose)
    location / {
        # 💡 تم تصحيح اسم الخدمة إلى 'react-app' بناءً على docker-compose السابق
        # (إذا كان تطبيقك يعمل على منفذ 3000، عدّل إلى http://react-app:3000)
        proxy_pass http://react-app:80; 
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}