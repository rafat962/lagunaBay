server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ⬅️ **التعديل هنا (النقطة الأهم)**
    location / {
        try_files $uri $uri/ /index.html;
    }
    # ➡️ هذا يعني: حاول إيجاد الملف المطلوب ($uri)، ثم حاول إيجاد دليل بهذا الاسم ($uri/)، وإذا لم تجد أياً منهما، قم بتقديم الملف /index.html.

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
server {
    # الاستماع للمنفذ الافتراضي لـ HTTPS
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name realestatemerchants.app; # اسم النطاق الخاص بك

    # ⬅️ مسارات الشهادات (SSL Certificates Paths)
    ssl_certificate /etc/letsencrypt/live/todo.yehie.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.yehie.tech/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # توجيه تطبيق React SPA 
    location / {
        try_files $uri $uri/ /index.html;
    }

    # يمكنك إضافة إعدادات SSL/TLS الأخرى هنا للأمان الإضافي...
}